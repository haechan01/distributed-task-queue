<!DOCTYPE html>
<html>

<head>
    <title>Raft Cluster Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        function BrokerCard({ nodeId, data }) {
            const stateColors = {
                leader: 'bg-green-500',
                follower: 'bg-blue-500',
                candidate: 'bg-yellow-500',
                failed: 'bg-red-500'
            };

            const isOnline = data.status === 'online';

            return (
                <div className={`p-4 rounded-lg border-2 ${isOnline ? 'border-gray-300' : 'border-red-500'}`}>
                    <div className="flex items-center justify-between mb-2">
                        <h3 className="font-bold">{nodeId}</h3>
                        <span className={`px-2 py-1 rounded text-white text-sm ${stateColors[data.state] || 'bg-gray-500'}`}>
                            {data.state?.toUpperCase()}
                        </span>
                    </div>
                    {isOnline ? (
                        <div className="text-sm space-y-1">
                            <div>Term: {data.term}</div>
                            <div>Log: {data.log_length} entries</div>
                            <div>Committed: {data.commit_index}</div>
                            <div className={data.replication_lag > 0 ? 'text-yellow-600' : 'text-green-600'}>
                                Lag: {data.replication_lag}
                            </div>
                        </div>
                    ) : (
                        <div className="text-red-500 text-sm">Unreachable</div>
                    )}
                </div>
            );
        }

        function WorkerCard({ workerId, data }) {
            const statusColors = {
                alive: data.current_task ? 'bg-yellow-500' : 'bg-green-500',
                failed: 'bg-red-500'
            };

            return (
                <div className="p-3 rounded border flex items-center gap-3">
                    <div className={`w-3 h-3 rounded-full ${statusColors[data.status]}`}></div>
                    <div>
                        <div className="font-medium">{workerId}</div>
                        <div className="text-xs text-gray-500">
                            {data.status === 'failed' ? 'FAILED' :
                                data.current_task ? `Processing: ${data.current_task.slice(0, 8)}...` : 'Idle'}
                        </div>
                    </div>
                </div>
            );
        }

        function Dashboard() {
            const [clusterData, setClusterData] = useState(null);
            const [error, setError] = useState(null);
            const [events, setEvents] = useState([]);
            const [prevWorkers, setPrevWorkers] = useState({});
            const [prevTasks, setPrevTasks] = useState({ pending: 0, processing: 0, completed: 0 });
            const [prevLeader, setPrevLeader] = useState(null);

            const brokerUrls = [
                'http://localhost:6001',
                'http://localhost:6002',
                'http://localhost:6003'
            ];

            const addEvent = (type, message) => {
                setEvents(e => [...e.slice(-50), {
                    time: new Date(),
                    type,
                    message
                }]);
            };

            useEffect(() => {
                const fetchStatus = async () => {
                    for (const url of brokerUrls) {
                        try {
                            const resp = await fetch(`${url}/cluster_status`);
                            if (resp.ok) {
                                const data = await resp.json();
                                setClusterData(data);
                                setError(null);

                                // Track leader changes
                                const currentLeader = data.leader;
                                const currentTerm = data.brokers[currentLeader]?.term;
                                if (prevLeader !== currentLeader && currentLeader) {
                                    addEvent('leader', `${currentLeader} became leader (term ${currentTerm})`);
                                    setPrevLeader(currentLeader);
                                }

                                // Track worker changes
                                const currentWorkers = data.workers || {};
                                Object.keys(currentWorkers).forEach(wid => {
                                    if (!prevWorkers[wid]) {
                                        addEvent('worker', `${wid} connected`);
                                    } else if (prevWorkers[wid]?.status === 'alive' && currentWorkers[wid]?.status === 'failed') {
                                        addEvent('worker', `${wid} disconnected`);
                                    }
                                });
                                setPrevWorkers(currentWorkers);

                                // Track task changes
                                const tasks = data.tasks || {};
                                if (tasks.completed > prevTasks.completed) {
                                    const diff = tasks.completed - prevTasks.completed;
                                    addEvent('task', `${diff} task(s) completed`);
                                }
                                if (tasks.pending > prevTasks.pending) {
                                    const diff = tasks.pending - prevTasks.pending;
                                    addEvent('task', `${diff} task(s) submitted`);
                                }
                                if (tasks.processing > prevTasks.processing) {
                                    const diff = tasks.processing - prevTasks.processing;
                                    addEvent('task', `${diff} task(s) assigned to workers`);
                                }
                                setPrevTasks({ ...tasks });

                                return;
                            }
                        } catch (e) {
                            continue;
                        }
                    }
                    setError('All brokers unreachable');
                };

                fetchStatus();
                const interval = setInterval(fetchStatus, 1000);
                return () => clearInterval(interval);
            }, [prevLeader, prevWorkers, prevTasks]);

            const eventColors = {
                leader: 'text-yellow-400',
                worker: 'text-cyan-400',
                task: 'text-green-400'
            };

            const eventIcons = {
                leader: '👑',
                worker: '👷',
                task: '📋'
            };

            if (error) {
                return <div className="p-8 text-red-500 text-center">{error}</div>;
            }

            if (!clusterData) {
                return <div className="p-8 text-center">Loading...</div>;
            }

            return (
                <div className="p-6 max-w-4xl mx-auto">
                    <h1 className="text-2xl font-bold mb-6">Raft Cluster Dashboard</h1>

                    {/* Brokers */}
                    <div className="mb-6">
                        <h2 className="text-lg font-semibold mb-3">Brokers</h2>
                        <div className="grid grid-cols-3 gap-4">
                            {Object.entries(clusterData.brokers).map(([id, data]) => (
                                <BrokerCard key={id} nodeId={id} data={data} />
                            ))}
                        </div>
                    </div>

                    {/* Workers */}
                    <div className="mb-6">
                        <h2 className="text-lg font-semibold mb-3">Workers</h2>
                        <div className="flex gap-4 flex-wrap">
                            {Object.entries(clusterData.workers).map(([id, data]) => (
                                <WorkerCard key={id} workerId={id} data={data} />
                            ))}
                            {Object.keys(clusterData.workers).length === 0 && (
                                <div className="text-gray-500">No workers connected</div>
                            )}
                        </div>
                    </div>

                    {/* Tasks */}
                    <div className="mb-6">
                        <h2 className="text-lg font-semibold mb-3">Task Queue</h2>
                        <div className="flex gap-6">
                            <div className="text-center">
                                <div className="text-3xl font-bold text-yellow-600">
                                    {clusterData.tasks.pending}
                                </div>
                                <div className="text-sm text-gray-500">Pending</div>
                            </div>
                            <div className="text-center">
                                <div className="text-3xl font-bold text-blue-600">
                                    {clusterData.tasks.processing}
                                </div>
                                <div className="text-sm text-gray-500">Processing</div>
                            </div>
                            <div className="text-center">
                                <div className="text-3xl font-bold text-green-600">
                                    {clusterData.tasks.completed}
                                </div>
                                <div className="text-sm text-gray-500">Completed</div>
                            </div>
                        </div>
                    </div>

                    {/* Event Log */}
                    <div>
                        <h2 className="text-lg font-semibold mb-3">Recent Events</h2>
                        <div className="bg-gray-900 text-green-400 p-4 rounded font-mono text-sm h-48 overflow-y-auto">
                            {events.length === 0 && (
                                <div className="text-gray-500">Waiting for events...</div>
                            )}
                            {events.slice(-15).reverse().map((event, i) => (
                                <div key={i} className={eventColors[event.type] || 'text-green-400'}>
                                    [{event.time.toLocaleTimeString()}] {eventIcons[event.type]} {event.message}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
    </script>
</body>

</html>
